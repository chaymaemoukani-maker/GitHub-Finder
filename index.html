<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GitHub Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
        <img src="git hub.png" alt="git" class="logo-img">GitHub Finder Profil</div>
     <button class="favoris">
        <img src="image/save.png" alt="save" class="icon">
        Bookmarks
     </button>
    </header>

    <div class="search-box">
    <input type="text" id="search-box" placeholder="Entre git GitHub username..." sear>
    <button class="search-btn">Search</button>
    </div>
    <section id="loading" class="hero">
        <div class="hero-content">
        <h1>🔍Find GitHub Users</h1>
        <p>Search for any GitHub username to get started</p>
         <div class="loader"></div>
        </div>
    </section >
    <section id="error" class="Hidden">
    <h1>Error</h1>
    <p>User not Found</p>
    </section>


    <section id="profil" class="profile-card">

  <section class="profile-card">

  <img src="image/profile.png" class="avatar">

  <div class="profile-info">
    <h2>test</h2>
    <p class="username">@test</p>
    <p class="bio">No bio available</p>

    <div class="stats">
      <div>
        <p>Followers</p>
        <strong>73</strong>
      </div>
      <div>
        <p>Following</p>
        <strong>0</strong>
      </div>
      <div>
        <p>Public Repos</p>
        <strong>5</strong>
      </div>
    </div>

    <a href="#">Visit GitHub Profile →</a>
  </div>

  <button class="bookmark">⭐ Bookmark</button>

</section>
</body>

</html>
